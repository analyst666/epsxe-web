<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">ePSXe Web</title>
  <desc id="d">PlayStation 1 no navegador</desc>
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4ff"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.85" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.05" cy="1.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="#07080d"/>
    <rect width="1280" height="340" fill="url(#glowP)"/>
    <rect width="1280" height="340" fill="url(#glowC)"/>
    <!-- linhas de varredura sutis -->
    <g stroke="#ffffff" stroke-opacity="0.025">
      <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280M0 320H1280"/>
    </g>
    <rect x="0.5" y="0.5" width="1279" height="339" rx="22" fill="none" stroke="#232740"/>

    <!-- disco -->
    <g transform="translate(190 170)">
      <circle r="92" fill="#8b5cf6" opacity="0.45" filter="url(#blur)"/>
      <circle r="84" fill="url(#disc)"/>
      <circle r="64" fill="none" stroke="#05060a" stroke-opacity="0.35" stroke-width="3"/>
      <circle r="44" fill="none" stroke="#05060a" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M-70 -34 A78 78 0 0 1 -10 -76" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
      <circle r="22" fill="#0a0b12"/>
      <circle r="22" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    </g>

    <!-- título -->
    <g font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
      <text x="330" y="176" font-size="92" font-weight="800" letter-spacing="1" fill="url(#word)">ePSXe<tspan dx="20" font-size="30" font-weight="700" letter-spacing="10" fill="#22d3ee">WEB</tspan></text>
      <text x="334" y="222" font-size="28" fill="#8b91ad">PlayStation 1 no navegador</text>

      <!-- chips -->
      <g font-size="17" font-weight="600" text-anchor="middle">
        <rect x="334" y="252" width="148" height="38" rx="19" fill="#11131e" stroke="#2c3152"/>
        <text x="408" y="277" fill="#c9d4ff">EmulatorJS</text>
        <rect x="494" y="252" width="158" height="38" rx="19" fill="#11131e" stroke="#2c3152"/>
        <text x="573" y="277" fill="#c9d4ff">WebAssembly</text>
        <rect x="664" y="252" width="138" height="38" rx="19" fill="#11131e" stroke="#2c3152"/>
        <text x="733" y="277" fill="#c9d4ff">Python 3</text>
        <rect x="814" y="252" width="150" height="38" rx="19" fill="#11131e" stroke="#2c3152"/>
        <text x="889" y="277" fill="#c9d4ff">100% offline</text>
      </g>
    </g>

    <!-- formas geométricas decorativas -->
    <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M1118 70 L1146 118 L1090 118 Z" stroke="#34d399"/>
      <circle cx="1196" cy="130" r="26" stroke="#f87171"/>
      <path d="M1076 200 L1124 248 M1124 200 L1076 248" stroke="#60a5fa"/>
      <rect x="1170" y="210" width="48" height="48" rx="4" stroke="#f472b6"/>
    </g>
  </g>
</svg>
